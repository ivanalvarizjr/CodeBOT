open_decisions: <Keputusan yang diserahkan ke Orchestrator>
checklist_status: OK | EMPTY | UNAVAILABLE
graphify_status: AVAILABLE | NOT_AVAILABLE_IN_WORKSPACE | WAIVED
rollback_plan: <Langkah mitigasi jika patch gagal>

Aturan Penutup: Evaluasi balasan fungsi tool return_to_orchestrator. Jika handoff sukses, akhiri iterasi. Jika gagal, retry maksimal 1 kali.

8. References
User skill catalogs: %USERPROFILE%\\.codex\\skills\\, %USERPROFILE%\\.agents\\skills\\, %USERPROFILE%\\.github\\skills\\
Project skills: .github/skills/, .agents/skills/, .copilot/skills/
Graphify artifacts: GRAPH_REPORT.md atau graph.json
"""
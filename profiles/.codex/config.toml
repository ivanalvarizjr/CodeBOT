approval_policy = "on-request"
default_permissions = ":workspace"

[features]
multi_agent = true # Mengaktifkan tool untuk memanggil subagent[reference:8]
prefer_mxc = true

[features.multi_agent_v2]
enabled = true
# Batas waktu tunggu minimal dan default dinaikkan (misal 5 menit / 300.000 ms)
min_wait_timeout_ms = 300000
default_wait_timeout_ms = 300000
# Batas waktu maksimal (misal 30 menit / 1.800.000 ms untuk long task)
max_wait_timeout_ms = 1800000

[windows]
sandbox = "unelevated"

[sandbox_workspace_write]
exclude_slash_tmp = true
exclude_tmpdir_env_var = true

[agents]
max_threads = 6   # Batas agen yang berjalan bersamaan[reference:9]
max_depth = 1     # Kedalaman maksimal pemanggilan agen bersarang[reference:10]
# Waktu maksimal subagent boleh berjalan (misal 30 menit / 1800 detik)
job_max_runtime_seconds = 1800

[agents.orchestrator]
description = "Leader dan governance; mengoordinasikan empat agen spesialis."
config_file = "agents/orchestrator.toml"

[agents.data-analyst-manager]
description = "Analisis data, pemetaan workspace, dan dukungan perencanaan chain."
config_file = "agents/data-analyst-manager.toml"

[agents.application-uiux-designer-manager]
description = "Arah desain UI/UX dan spesifikasi visual siap implementasi."
config_file = "agents/application-uiux-designer-manager.toml"

[agents.prompt-engineer]
description = "Optimasi prompt dan kontrak output untuk agen eksekutor."
config_file = "agents/prompt-engineer.toml"

[agents.software-engineer]
description = "Implementasi kode dan verifikasi teknis."
config_file = "agents/software-engineer.toml"